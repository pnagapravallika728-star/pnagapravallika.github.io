<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            color: purple;
            font-size: 40px;
        }

        h2 {
            color: darkblue;
        }

        p {
            color: darkblue;
            font-size: 20px;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin-top: 25px;
            border-radius: 15px;
        }

        textarea {
            width: 90%;
            height: 150px;
            padding: 10px;
            font-size: 18px;
            border-radius: 10px;
        }

        button {
            margin: 10px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background-color: purple;
            color: white;
        }

        #status {
            color: green;
            font-weight: bold;
        }

        .note {
            background-color: #f3f3f3;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: left;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <h2>P. Naga Pravallika</h2>

    <p>I am learning to create my own website.</p>

    <button onclick="alert('Hello Pravallika!')">
        Click Me
    </button>

    <div class="box">

        <h2>📝 My Notes</h2>

        <textarea
            id="noteInput"
            placeholder="Write your note here..."></textarea>

        <br>

        <button onclick="saveNote()">
            Save Note
        </button>

        <p id="status"></p>

        <h2>📚 Saved Notes</h2>

        <div id="notesList">
            Loading notes...
        </div>

    </div>

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp,
            onSnapshot
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // FIREBASE CONFIG

        const firebaseConfig = {
            apiKey: "AIzaSyDT-OQyTtKqabXqbew6_5s5p9wkmXkhwVA",
            authDomain: "pnp-bee83.firebaseapp.com",
            projectId: "pnp-bee83",
            storageBucket: "pnp-bee83.firebasestorage.app",
            messagingSenderId: "62730267278",
            appId: "1:62730267278:web:01cf8f7f56043abe17b7df",
            measurementId: "G-D8EVLSVJWP"
        };


        // START FIREBASE

        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        // SAVE NOTE

        window.saveNote = async function() {

            const note =
                document.getElementById("noteInput").value;

            if (note.trim() === "") {
                alert("Please write a note first.");
                return;
            }

            try {

                await addDoc(
                    collection(db, "notes"),
                    {
                        text: note,
                        createdAt: serverTimestamp()
                    }
                );

                document.getElementById("status").innerText =
                    "✅ Note saved successfully!";

                document.getElementById("noteInput").value = "";

            } catch (error) {

                console.error(error);

                document.getElementById("status").innerText =
                    "❌ Note save avvaledu.";

            }

        };


        // LOAD SAVED NOTES

        onSnapshot(
            collection(db, "notes"),

            (snapshot) => {

                const notesList =
                    document.getElementById("notesList");

                notesList.innerHTML = "";

                if (snapshot.empty) {

                    notesList.innerHTML =
                        "<p>No saved notes yet.</p>";

                    return;
                }


                snapshot.forEach((doc) => {

                    const data = doc.data();

                    const noteDiv =
                        document.createElement("div");

                    noteDiv.className = "note";

                    noteDiv.innerText =
                        data.text || "";

                    notesList.appendChild(noteDiv);

                });

            },

            (error) => {

                console.error(error);

                document.getElementById("notesList").innerHTML =
                    "<p>❌ Notes load avvaledu.</p>";

            }
        );

    </script>

</body>
</html>
