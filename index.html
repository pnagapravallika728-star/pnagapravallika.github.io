<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: purple;
            font-size: 40px;
        }

        h2 {
            color: darkblue;
        }

        p {
            color: darkblue;
            font-size: 20px;
        }

        textarea {
            width: 80%;
            height: 150px;
            font-size: 18px;
            padding: 10px;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <h2>P. Naga Pravallika</h2>

    <p>I am learning to create my own website.</p>

    <h2>📝 My Notes</h2>

    <textarea id="note" placeholder="Write your information here..."></textarea>

    <br>

    <button onclick="saveNote()">Save Note</button>

    <button onclick="clearNote()">Clear</button>

    <script>
        function saveNote() {
            let text = document.getElementById("note").value;

            localStorage.setItem("myNote", text);

            alert("Information saved!");
        }

        document.getElementById("note").value =
            localStorage.getItem("myNote") || "";

        function clearNote() {
            document.getElementById("note").value = "";
            localStorage.removeItem("myNote");
        }
    </script>

</body>
</html>
