<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            color: purple;
            font-size: 40px;
        }

        h2 {
            color: darkblue;
        }

        p {
            color: darkblue;
            font-size: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 15px;
        }

        textarea {
            width: 90%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
        }

        input {
            padding: 10px;
            width: 90%;
            margin: 10px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <h2>P. Naga Pravallika</h2>

    <p>I am learning to create my own website.</p>

    <div class="box">
        <h2>📝 My Notes</h2>

        <input type="text" id="titleInput" placeholder="Enter note title">

        <textarea id="noteInput"
            placeholder="Write your note here..."></textarea>

        <br>

        <button onclick="saveNote()">Save Note</button>

        <div id="message"></div>
    </div>


    <!-- Firebase -->
    <script type="module">

        import { initializeApp } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // ==============================
        // PAnpm install firebase STE YOUR FIREBASE CONFIG HERE
        // ==============================

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };


        // Start Firebase
        const app = initializeApp(firebaseConfig);

        // Start Firestore
        const db = getFirestore(app);


        // Save Note
        window.saveNote = async function () {

            const title =
                document.getElementById("titleInput").value;

            const note =
                document.getElementById("noteInput").value;

            if (title === "" || note === "") {
                alert("Please enter title and note.");
                return;
            }

            try {

                await addDoc(collection(db, "notes"), {
                    title: title,
                    note: note,
                    createdAt: new Date()
                });

                document.getElementById("message").innerHTML =
                    "<p>✅ Note saved successfully!</p>";

                document.getElementById("titleInput").value = "";
                document.getElementById("noteInput").value = "";

            } catch (error) {

                console.error(error);

                alert("Note save failed. Check Firebase settings.");

            }
        };

    </script>

</body>
</html>
